<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yer & Nyla</title>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #f4e6d0;
      --dim: #b9a58f;
      --panel: rgba(14, 10, 28, .72);
      --line: #f0a868;
      --yer: #e8b27a;
      --nyla: #d9a0a0;
      --bg: #0d0a1a;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #0d0a1a
      }
    }

    :root[data-theme="dark"] {
      --bg: #0d0a1a
    }

    html {
      height: 100%;
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      display: flex;
      justify-content: center;
      font-family: 'Pixelify Sans', 'Courier New', monospace;
      color: var(--ink);
      -webkit-tap-highlight-color: transparent
    }

    #stage {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      overflow: hidden;
      background: #000
    }

    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center bottom;
      image-rendering: pixelated;
      opacity: 0;
      transition: opacity 2s ease
    }

    .bg.on {
      opacity: 1
    }

    #shade {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 70%, transparent 40%, rgba(5, 3, 15, .55));
      opacity: 0;
      transition: opacity 2s;
      pointer-events: none
    }

    #shade.on {
      opacity: 1
    }

    .sp {
      position: absolute;
      bottom: 6%;
      width: auto;
      image-rendering: pixelated;
      transition: opacity .6s, filter .4s;
      animation: breathe 2.4s steps(2) infinite
    }

    .sp.off {
      opacity: 0;
      pointer-events: none
    }

    #yer {
      left: 9%;
      height: 40%;
      transform: scaleX(-1)
    }

    #nyla {
      right: 12%;
      height: 34%
    }

    #cry {
      right: 8%;
      height: 23%;
      animation-delay: .3s
    }

    #hug {
      left: 50%;
      height: 41%;
      margin-left: -14%;
      animation: none
    }

    .dim {
      filter: brightness(.62)
    }

    @keyframes breathe {
      50% {
        translate: 0 -2px
      }
    }

    #yer {
      animation-name: breatheY
    }

    @keyframes breatheY {
      50% {
        translate: 0 -2px
      }
    }

    #box {
      position: absolute;
      left: 5%;
      right: 5%;
      top: calc(5% + env(safe-area-inset-top, 0px));
      min-height: 92px;
      padding: 12px 14px 14px;
      background: var(--panel);
      border: 3px solid var(--line);
      box-shadow: 0 0 0 3px #1b1230, 5px 5px 0 rgba(0, 0, 0, .35);
      transition: opacity .5s
    }

    #box.hide {
      opacity: 0;
      pointer-events: none
    }

    #who {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
      min-height: 18px
    }

    #txt {
      font-size: 18px;
      line-height: 1.45;
      min-height: 3.9em
    }

    #txt.nar {
      font-style: italic;
      color: var(--dim)
    }

    #ch {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px
    }

    #ch button {
      font: inherit;
      font-size: 16px;
      text-align: left;
      color: var(--ink);
      background: rgba(240, 168, 104, .14);
      border: 2px solid var(--line);
      padding: 9px 12px;
      cursor: pointer
    }

    #ch button:hover,
    #ch button:focus-visible {
      background: rgba(240, 168, 104, .34);
      outline: none
    }

    #next {
      position: absolute;
      left: 50%;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      font: inherit;
      font-size: 14px;
      color: var(--ink);
      background: rgba(10, 6, 22, .5);
      border: 2px solid rgba(240, 168, 104, .55);
      padding: 7px 20px;
      cursor: pointer;
      opacity: .85
    }

    #next:hover,
    #next:focus-visible {
      opacity: 1;
      outline: 2px solid var(--line);
      outline-offset: 2px
    }

    #next[hidden] {
      display: none
    }

    #end {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
      background: rgba(8, 5, 18, .55);
      opacity: 0;
      pointer-events: none;
      transition: opacity 2.5s
    }

    #end.on {
      opacity: 1;
      pointer-events: auto
    }

    #end p {
      margin: 0;
      font-size: 26px;
      line-height: 1.5
    }

    #end button {
      font: inherit;
      font-size: 14px;
      color: var(--dim);
      background: none;
      border: 2px solid var(--dim);
      padding: 6px 16px;
      cursor: pointer
    }

    @media (prefers-reduced-motion:reduce) {
      .sp {
        animation: none
      }

      .bg,
      #shade,
      #end {
        transition-duration: .01s
      }
    }

    #intro {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      background: rgba(8, 5, 18, .8);
      transition: opacity 1.4s
    }

    #intro.gone {
      opacity: 0;
      pointer-events: none
    }

    #intro h1 {
      margin: 0;
      font-size: 36px;
      font-weight: 600;
      letter-spacing: .04em
    }

    #intro p {
      margin: 0;
      color: var(--dim);
      font-size: 15px
    }

    #go,
    #snd {
      font: inherit;
      color: var(--ink);
      background: rgba(10, 6, 22, .5);
      border: 2px solid rgba(240, 168, 104, .55);
      cursor: pointer
    }

    #go {
      font-size: 18px;
      padding: 9px 26px;
      margin-top: 6px
    }

    #snd {
      position: absolute;
      left: 14px;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      font-size: 13px;
      padding: 7px 12px;
      opacity: .85;
      z-index: 3
    }

    #snd[hidden] {
      display: none
    }

    #go:focus-visible,
    #snd:focus-visible {
      outline: 2px solid var(--line);
      outline-offset: 2px
    }
  </style>
</head>

    const $ = id => document.getElementById(id);
    const Y = 'Yer', N = 'Nyla';
    const S = (who, text, o = {}) => Object.assign({ who, text }, o);
    const Nr = (text, o = {}) => Object.assign({ who: '', text, nar: 1 }, o);
    let tk = 0;
    let script = [
      Nr('Senja di tepi rawa. Nyla udah berdiri di sana sejak tadi, menatap matahari yang pelan pelan turun.'),
      S(Y, 'Kamu ga bales pesanku dua minggu.'),
      S(N, 'Aku sibuk.'),
      S(Y, 'Bohong.'),
      S(N, '...'),
      S(N, 'Kamu ga perlu terus dateng, tau.'),
      S(Y, 'Aku tau.'),
      S(N, 'Terus kenapa masih dateng?'),
      S(Y, 'Karena aku mau.'),
      S(N, 'Kamu belom liat semuanya, Yer. Kerjaan yang berantakan. Rumah yang... ya, gitulah. Kepala yang ribut tiap malem. Kamu cuma liat bagian yang sempet aku rapiin.'),
      S(Y, 'Kalo gitu kenapa aku ga boleh liat sisanya?'),
      S(N, 'Karena nanti kamu pergi.'),

        choice: [
          { label: '"Aku ga ke mana mana."', lines: [S(Y, 'Aku ga ke mana mana.'), S(N, 'Semua orang bilang gitu di awal.')] },

      Nr('Untuk sesaat Nyla tidak menjawab. Lalu bahunya mulai bergetar.', { bg: 'night', nyla: 'cry' }),

      S(N, 'Aku cape pura pura kuat. Cape bilang "aku baik baik aja" padahal tiap malem aku ga yakin besok bisa bangun dengan perasaan yang sama.', { slow: 1 }),

      S(N, 'Jadi aku belajar jalan sendirian. Biar kalo semua orang pergi, aku ga kaget.', { slow: 1 }),
      S(Y, 'Kamu ga perlu belajar itu lagi.'),
      S(N, 'Kamu ga ngerti...', { slow: 1 }),
      S(Y, 'Mungkin belom semuanya. Tapi aku mau belajar.'),
      S(Y, 'Denger, Nyla. Kamu ga harus pantes dulu supaya boleh dicintai. Cinta bukan hadiah buat orang yang udah beres.'),
      S(Y, 'Aku ga minta kamu baik baik aja. Aku cuma minta, jangan usir aku pas kamu lagi ga baik baik aja.'),
      S(N, 'Kalo aku ga sembuh sembuh?', { slow: 1 }),
      S(Y, 'Aku tetep di sini.', { fast: 1 }),
      S(N, 'Kalo aku ga pernah jadi orang yang kamu bayangin?', { slow: 1 }),
      S(Y, 'Aku ga jatuh cinta sama bayangan. Aku jatuh cinta sama kamu. Yang selalu ngerasa ga pantes, yang overthinking, yang pura pura ga butuh siapa siapa.'),
      S(Y, 'Apapun yang terjadi, besok, bulan depan, bagaimanapun hasilnya nanti, aku di sini.', { fast: 1 }),
      {
        choice: [
          { label: '[ Peluk dia ]', lines: [] },
          { label: '[ Tunggu sebentar ]', lines: [Nr('Yer melangkah setengah, lalu berhenti. Ia memberi Nyla ruang untuk menarik napas.'), S(Y, 'Pelan pelan aja. Aku ga ke mana mana.')], again: 1 }]
      },
      Nr('Yer melangkah mendekat. Kali ini Nyla tidak mendorongnya.', { hug: 1 }),
      S(N, 'Aku masih takut.', { slow: 1 }),
      S(Y, 'Boleh. Takut aja di sini, sama aku.'),
      S(N, 'Maaf... aku udah sering banget nyuruh kamu pergi.', { slow: 1 }),
      S(Y, 'Gapapa. Aku juga sering banget ga pergi.'),
      S(N, '...Makasih.', { slow: 1 }),
      S(Y, 'Kamu ga perlu berterima kasih buat hal yang memang mau aku lakuin.'),
      Nr('Langit sudah sepenuhnya gelap. Di antara rerumputan, kunang kunang mulai menyala satu per satu.', { shade: 1 }),
      { end: 1 }];
    let q, i, typing = null, full = '', cur;
    const box = $('box'), who = $('who'), txt = $('txt'), ch = $('ch'), nx = $('next');
    function show(id, on) { $(id).classList.toggle('off', !on) }
    function pose(l) {
      if (l.bg === 'night') { $('bgNight').classList.add('on'); $('bgDay').classList.remove('on') }
      if (l.nyla === 'cry') { show('nyla', 0); show('cry', 1) }
      if (l.hug) { show('yer', 0); show('cry', 0); show('nyla', 0); show('hug', 1) }
      if (l.shade) $('shade').classList.add('on'); if (l.hug) mood = 1;
      const talk = l.who;
      ['yer', 'nyla', 'cry'].forEach(k => { const n = (k === 'yer') ? Y : N; $(k).classList.toggle('dim', !!talk && talk !== n) });
    }
    function type(l) {
      const d = l.slow ? 70 : l.fast ? 22 : 34; full = l.text; let n = 0; txt.textContent = '';
      clearInterval(typing); const tok = ++tk;
      typing = setInterval(() => {
        n++; txt.textContent = full.slice(0, n); tick(l, full[n - 1]);
        if (n >= full.length) { clearInterval(typing); typing = null }
        else if (l.slow && '.,?'.includes(full[n - 1])) { clearInterval(typing); setTimeout(() => { if (typing !== null && tok === tk) type2(l, n) }, 300) }
      }, d);
    }
    function type2(l, n) {
      const d = l.slow ? 70 : 34; typing = setInterval(() => {
        n++; txt.textContent = full.slice(0, n); tick(l, full[n - 1]);
        if (n >= full.length) { clearInterval(typing); typing = null }
      }, d)
    }
    function step() {
      const l = q[i];
      if (l.choice) {
        box.classList.remove('hide'); who.textContent = ''; txt.textContent = ''; txt.className = '';
        ch.innerHTML = ''; ch.style.display = 'flex'; nx.hidden = true;
        l.choice.forEach(o => {
          const b = document.createElement('button'); b.textContent = o.label;
          b.onclick = () => {
            ch.style.display = 'none'; nx.hidden = false;
            const extra = o.again ? [...o.lines, l] : o.lines; if (o.again) l.choice = l.choice.filter(x => !x.again);
            q.splice(i + 1, 0, ...extra); i++; if (i < q.length) step()
          }; ch.appendChild(b)
        });
        ch.firstChild.focus({ preventScroll: true }); return
      }
      if (l.end) { box.classList.add('hide'); nx.hidden = true; $('end').classList.add('on'); return }
      pose(l);
      who.textContent = l.who; who.style.color = l.who === Y ? 'var(--yer)' : 'var(--nyla)';
      txt.className = l.nar ? 'nar' : ''; type(l);
    }
    function next() {
      if (typing) { clearInterval(typing); typing = null; txt.textContent = full; return }
      if (ch.style.display === 'flex') return;
      i++; if (i < q.length) step();
    }
    function start() {
      mood = 0; q = script.map(x => x.choice ? { choice: x.choice.map(o => ({ ...o })) } : x); i = 0;
      ['bgNight', 'shade', 'end'].forEach(id => $(id).classList.remove('on')); $('bgDay').classList.add('on');
      show('yer', 1); show('nyla', 1); show('cry', 0); show('hug', 0); box.classList.remove('hide'); nx.hidden = false; step();
    }
    nx.onclick = next; $('again').onclick = start;
    document.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { if (document.activeElement.tagName !== 'BUTTON') { e.preventDefault(); next() } } });
    let ac, mg, lp, sf, muted = false, mood = 0, nt = 0, bar = 0, tc = 0;
    const hz = m => 440 * Math.pow(2, (m - 69) / 12);
    const PROG = [[[57, 60, 64], [53, 57, 60], [48, 55, 64], [55, 59, 62]], [[48, 55, 64], [55, 59, 62], [57, 60, 64], [53, 57, 60]]];
    function tone(f, t, dur, type, vol, att) {
      const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + att); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(lp); o.start(t); o.stop(t + dur + .05);
    }
    function sched() {
      while (nt < ac.currentTime + 1.5) {
        const c = PROG[mood][bar % 4];
        c.forEach(m => tone(hz(m), nt, 5.2, 'triangle', .05, 1.4));
        [0, 1, 2, 1].forEach((k, j) => { if (j === 3 && Math.random() < .5) return; tone(hz(c[k] + 12), nt + j * 1.1 + .05, 2.4, 'sine', .07, .01) });
        nt += 4.4; bar++;
      }
    }
    function initAudio() {
      if (ac) return;
      ac = new (window.AudioContext || window.webkitAudioContext)();
      mg = ac.createGain(); mg.gain.value = .7; mg.connect(ac.destination);
      lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1500; lp.connect(mg);
      const dl = ac.createDelay(); dl.delayTime.value = .45; const fb = ac.createGain(); fb.gain.value = .38;
      lp.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(mg);
      sf = ac.createBiquadFilter(); sf.type = 'lowpass'; sf.frequency.value = 2400; sf.connect(mg);
      nt = ac.currentTime + .2; sched(); setInterval(sched, 500);
      document.addEventListener('visibilitychange', () => document.hidden ? ac.suspend() : ac.resume());
    }
    function tick(l, c) {
      if (!ac || muted || c === ' ' || ++tc % 2) return;
      const f = (l.nar ? 170 : l.who === Y ? 200 : 300) * (1 + Math.random() * .12), t = ac.currentTime;
      const o = ac.createOscillator(), g = ac.createGain(); o.type = l.nar ? 'sine' : 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(l.nar ? .03 : .025, t); g.gain.exponentialRampToValueAtTime(.0001, t + .06);
      o.connect(g).connect(sf); o.start(t); o.stop(t + .07);
    }
    $('go').onclick = () => { initAudio(); ac.resume(); $('intro').classList.add('gone'); $('snd').hidden = false; start() };
    $('snd').onclick = e => { muted = !muted; mg.gain.value = muted ? 0 : .7; e.target.textContent = muted ? 'Suara: mati' : 'Suara: nyala'; e.target.setAttribute('aria-pressed', muted) };
  </script>
