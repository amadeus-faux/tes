<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yer & Nyla</title>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #f4e6d0;
      --dim: #b9a58f;
      --panel: rgba(14, 10, 28, .72);
      --line: #f0a868;
      --yer: #e8b27a;
      --nyla: #d9a0a0;
      --bg: #0d0a1a;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #0d0a1a
      }
    }

    :root[data-theme="dark"] {
      --bg: #0d0a1a
    }

    html {
      height: 100%;
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      display: flex;
      justify-content: center;
      font-family: 'Pixelify Sans', 'Courier New', monospace;
      color: var(--ink);
      -webkit-tap-highlight-color: transparent
    }

    #stage {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      overflow: hidden;
      background: #000
    }

    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center bottom;
      image-rendering: pixelated;
      opacity: 0;
      transition: opacity 2s ease
    }

    .bg.on {
      opacity: 1
    }

    #shade {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 70%, transparent 40%, rgba(5, 3, 15, .55));
      opacity: 0;
      transition: opacity 2s;
      pointer-events: none
    }

    #shade.on {
      opacity: 1
    }

    .sp {
      position: absolute;
      bottom: 6%;
      width: auto;
      image-rendering: pixelated;
      transition: opacity .6s, filter .4s;
      animation: breathe 2.4s steps(2) infinite
    }

    .sp.off {
      opacity: 0;
      pointer-events: none
    }

    #yer {
      left: 9%;
      height: 40%;
      transform: scaleX(-1)
    }

    #nyla {
      right: 12%;
      height: 34%
    }

    #cry {
      right: 8%;
      height: 23%;
      animation-delay: .3s
    }

    #hug {
      left: 50%;
      height: 41%;
      margin-left: -14%;
      animation: none
    }

    .dim {
      filter: brightness(.62)
    }

    @keyframes breathe {
      50% {
        translate: 0 -2px
      }
    }

    #yer {
      animation-name: breatheY
    }

    @keyframes breatheY {
      50% {
        translate: 0 -2px
      }
    }

    #box {
      position: absolute;
      left: 5%;
      right: 5%;
      top: calc(5% + env(safe-area-inset-top, 0px));
      min-height: 92px;
      padding: 12px 14px 14px;
      background: var(--panel);
      border: 3px solid var(--line);
      box-shadow: 0 0 0 3px #1b1230, 5px 5px 0 rgba(0, 0, 0, .35);
      transition: opacity .5s
    }

    #box.hide {
      opacity: 0;
      pointer-events: none
    }

    #who {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
      min-height: 18px
    }

    #txt {
      font-size: 18px;
      line-height: 1.45;
      min-height: 3.9em
    }

    #txt.nar {
      font-style: italic;
      color: var(--dim)
    }

    #ch {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px
    }

    #ch button {
      font: inherit;
      font-size: 16px;
      text-align: left;
      color: var(--ink);
      background: rgba(240, 168, 104, .14);
      border: 2px solid var(--line);
      padding: 9px 12px;
      cursor: pointer
    }

    #ch button:hover,
    #ch button:focus-visible {
      background: rgba(240, 168, 104, .34);
      outline: none
    }

    #next {
      position: absolute;
      left: 50%;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      font: inherit;
      font-size: 14px;
      color: var(--ink);
      background: rgba(10, 6, 22, .5);
      border: 2px solid rgba(240, 168, 104, .55);
      padding: 7px 20px;
      cursor: pointer;
      opacity: .85
    }

    #next:hover,
    #next:focus-visible {
      opacity: 1;
      outline: 2px solid var(--line);
      outline-offset: 2px
    }

    #next[hidden] {
      display: none
    }

    #end {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
      background: rgba(8, 5, 18, .55);
      opacity: 0;
      pointer-events: none;
      transition: opacity 2.5s
    }

    #end.on {
      opacity: 1;
      pointer-events: auto
    }

    #end p {
      margin: 0;
      font-size: 26px;
      line-height: 1.5
    }

    #end button {
      font: inherit;
      font-size: 14px;
      color: var(--dim);
      background: none;
      border: 2px solid var(--dim);
      padding: 6px 16px;
      cursor: pointer
    }

    @media (prefers-reduced-motion:reduce) {
      .sp {
        animation: none
      }

      .bg,
      #shade,
      #end {
        transition-duration: .01s
      }
    }
  </style>
</head>

      S(N, 'Kamu ga ngerti...', { slow: 1 }),
      S(Y, 'Mungkin belom semuanya. Tapi aku mau belajar.'),
      S(Y, 'Dengar, Nyla. Kamu ga harus pantes dulu supaya boleh dicintai. Cinta bukan hadiah buat orang yang sudah beres.'),
      S(Y, 'Aku ga minta kamu baik baik aja. Aku cuma minta, jangan usir aku pas kamu lagi ga baik baik aja.'),
      S(N, 'Kalo aku ga sembuh sembuh?', { slow: 1 }),
      S(Y, 'Aku tetap di sini.', { fast: 1 }),
      S(N, 'Kalo aku ga pernah jadi orang yang kamu bayangkan?', { slow: 1 }),
      S(Y, 'Aku ga jatuh cinta sama bayangan. Aku jatuh cinta sama kamu. Yang ngerasa ga pantes, yang overthinking, yang pura pura ga butuh siapa siapa.'),
      S(Y, 'Apa pun yang terjadi, besok, bulan depan, bagaimanapun hasilnya nanti, aku di sini.', { fast: 1 }),
      {
        choice: [
          { label: '[ Peluk dia ]', lines: [] },
          { label: '[ Tunggu sebentar ]', lines: [Nr('Yer melangkah setengah, lalu berhenti. Ia memberi Nyla ruang untuk menarik napas.'), S(Y, 'Pelan pelan aja. Aku ga ke mana mana.')], again: 1 }]
      },
      Nr('Yer melangkah mendekat. Kali ini Nyla tidak mendorongnya.', { hug: 1 }),
      S(N, 'Aku masih takut.', { slow: 1 }),
      S(Y, 'Boleh. Takut aja di sini, sama aku.'),
      S(N, 'Maaf... aku udah sering banget nyuruh kamu pergi.', { slow: 1 }),
      S(Y, 'Ga apa apa. Aku juga sering banget ga pergi.'),
      S(N, '...Makasih.', { slow: 1 }),
      S(Y, 'Kamu ga perlu berterima kasih untuk hal yang memang mau aku lakukan.'),
      Nr('Langit sudah sepenuhnya gelap. Di antara rerumputan, kunang-kunang mulai menyala satu per satu.', { shade: 1 }),
      { end: 1 }];
    let q, i, typing = null, full = '', cur;
    const box = $('box'), who = $('who'), txt = $('txt'), ch = $('ch'), nx = $('next');
    function show(id, on) { $(id).classList.toggle('off', !on) }
    function pose(l) {
      if (l.bg === 'night') { $('bgNight').classList.add('on'); $('bgDay').classList.remove('on') }
      if (l.nyla === 'cry') { show('nyla', 0); show('cry', 1) }
      if (l.hug) { show('yer', 0); show('cry', 0); show('nyla', 0); show('hug', 1) }
      if (l.shade) $('shade').classList.add('on');
      const talk = l.who;
      ['yer', 'nyla', 'cry'].forEach(k => { const n = (k === 'yer') ? Y : N; $(k).classList.toggle('dim', !!talk && talk !== n) });
    }
    function type(l) {
      const d = l.slow ? 70 : l.fast ? 22 : 34; full = l.text; let n = 0; txt.textContent = '';
      clearInterval(typing); const tok = ++tk;
      typing = setInterval(() => {
        n++; txt.textContent = full.slice(0, n);
        if (n >= full.length) { clearInterval(typing); typing = null }
        else if (l.slow && '.,?'.includes(full[n - 1])) { clearInterval(typing); setTimeout(() => { if (typing !== null && tok === tk) type2(l, n) }, 300) }
      }, d);
    }
    function type2(l, n) {
      const d = l.slow ? 70 : 34; typing = setInterval(() => {
        n++; txt.textContent = full.slice(0, n);
        if (n >= full.length) { clearInterval(typing); typing = null }
      }, d)
    }
    function step() {
      const l = q[i];
      if (l.choice) {
        box.classList.remove('hide'); who.textContent = ''; txt.textContent = ''; txt.className = '';
        ch.innerHTML = ''; ch.style.display = 'flex'; nx.hidden = true;
        l.choice.forEach(o => {
          const b = document.createElement('button'); b.textContent = o.label;
          b.onclick = () => {
            ch.style.display = 'none'; nx.hidden = false;
            const extra = o.again ? [...o.lines, l] : o.lines; if (o.again) l.choice = l.choice.filter(x => !x.again);
            q.splice(i + 1, 0, ...extra); i++; if (i < q.length) step()
          }; ch.appendChild(b)
        });
        ch.firstChild.focus({ preventScroll: true }); return
      }
      if (l.end) { box.classList.add('hide'); nx.hidden = true; $('end').classList.add('on'); return }
      pose(l);
      who.textContent = l.who; who.style.color = l.who === Y ? 'var(--yer)' : 'var(--nyla)';
      txt.className = l.nar ? 'nar' : ''; type(l);
    }
    function next() {
      if (typing) { clearInterval(typing); typing = null; txt.textContent = full; return }
      if (ch.style.display === 'flex') return;
      i++; if (i < q.length) step();
    }
    function start() {
      q = script.map(x => x.choice ? { choice: x.choice.map(o => ({ ...o })) } : x); i = 0;
      ['bgNight', 'shade', 'end'].forEach(id => $(id).classList.remove('on')); $('bgDay').classList.add('on');
      show('yer', 1); show('nyla', 1); show('cry', 0); show('hug', 0); box.classList.remove('hide'); nx.hidden = false; step();
    }
    nx.onclick = next; $('again').onclick = start;
    document.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { if (document.activeElement.tagName !== 'BUTTON') { e.preventDefault(); next() } } });
    start();
  </script>
</body>
